<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人脸识别签到系统 - 登录</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-body">
    <!-- 背景装饰 -->
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
        <div class="shape shape-5"></div>
        <div class="shape shape-6"></div>
    </div>

    <div class="login-wrapper">
        <!-- 左侧品牌区 -->
        <div class="login-brand">
            <div class="brand-icon">
                <svg viewBox="0 0 80 80" width="80" height="80">
                    <defs>
                        <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#a78bfa"/>
                            <stop offset="100%" style="stop-color:#6366f1"/>
                        </linearGradient>
                    </defs>
                    <!-- 人脸轮廓 -->
                    <ellipse cx="40" cy="30" rx="18" ry="20" fill="none" stroke="url(#iconGrad)" stroke-width="3"/>
                    <!-- 眼睛 -->
                    <circle cx="33" cy="28" r="3" fill="url(#iconGrad)"/>
                    <circle cx="47" cy="28" r="3" fill="url(#iconGrad)"/>
                    <!-- 微笑 -->
                    <path d="M30 40 Q40 50 50 40" fill="none" stroke="url(#iconGrad)" stroke-width="2.5" stroke-linecap="round"/>
                    <!-- 扫描线 -->
                    <line x1="25" y1="55" x2="55" y2="55" stroke="url(#iconGrad)" stroke-width="1.5" opacity="0.6"/>
                    <line x1="30" y1="60" x2="50" y2="60" stroke="url(#iconGrad)" stroke-width="1.5" opacity="0.4"/>
                </svg>
            </div>
            <h1>FaceCheck</h1>
            <p class="brand-subtitle">智能人脸识别签到系统</p>
            <div class="brand-features">
                <div class="feature-item">
                    <span class="feature-dot"></span>
                    <span>秒级人脸识别</span>
                </div>
                <div class="feature-item">
                    <span class="feature-dot"></span>
                    <span>实时签到统计</span>
                </div>
                <div class="feature-item">
                    <span class="feature-dot"></span>
                    <span>数据可视化分析</span>
                </div>
            </div>
        </div>

        <!-- 右侧登录表单 -->
        <div class="login-panel">
            <div class="panel-header">
                <h2>欢迎回来</h2>
                <p>请选择身份并登录系统</p>
            </div>

            <!-- 角色切换 -->
            <div class="role-switch">
                <button class="role-btn active" data-role="student">
                    <span class="role-icon">&#x1F393;</span>
                    <span>学生登录</span>
                </button>
                <button class="role-btn" data-role="teacher">
                    <span class="role-icon">&#x1F468;&#x200D;&#x1F3EB;</span>
                    <span>教师登录</span>
                </button>
            </div>

            <!-- 表单 -->
            <div class="login-form">
                <div class="input-group" id="usernameGroup">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </span>
                    <input type="text" id="username" placeholder="请输入学号" autocomplete="off">
                </div>

                <div class="input-group">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round">
                            <rect x="3" y="11" width="18" height="11" rx="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                    </span>
                    <input type="password" id="password" placeholder="请输入密码">
                </div>

                <div class="form-error" id="errorMsg"></div>

                <button class="login-btn" id="loginBtn" onclick="doLogin()">
                    <span id="btnText">登 录</span>
                    <span class="btn-arrow" id="btnArrow">&rarr;</span>
                </button>
            </div>

            <div class="panel-footer">
                <p>教师: admin / 123456 &nbsp;|&nbsp; 学生初始密码: 123456</p>
            </div>
        </div>
    </div>

    <script>
        let currentRole = 'student';

        document.querySelectorAll('.role-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentRole = this.dataset.role;
                const input = document.getElementById('username');
                if (currentRole === 'teacher') {
                    input.placeholder = '请输入教师账号';
                } else {
                    input.placeholder = '请输入学号';
                }
                document.getElementById('errorMsg').textContent = '';
                document.getElementById('username').focus();
            });
        });

        document.getElementById('password').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') doLogin();
        });
        document.getElementById('username').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') document.getElementById('password').focus();
        });

        async function doLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('errorMsg');

            if (!username || !password) {
                errorEl.textContent = '请输入账号和密码';
                return;
            }

            const btn = document.getElementById('loginBtn');
            document.getElementById('btnText').textContent = '登录中';
            document.getElementById('btnArrow').textContent = '...';
            btn.disabled = true;
            btn.classList.add('loading');

            try {
                const resp = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ role: currentRole, username, password })
                });
                const data = await resp.json();
                if (data.success) {
                    btn.classList.add('success');
                    document.getElementById('btnText').textContent = '登录成功';
                    document.getElementById('btnArrow').textContent = '✓';
                    setTimeout(() => { window.location.href = data.redirect; }, 400);
                } else {
                    errorEl.textContent = data.message;
                    btn.classList.add('shake');
                    setTimeout(() => btn.classList.remove('shake'), 500);
                }
            } catch (e) {
                errorEl.textContent = '网络错误，请重试';
            } finally {
                if (!btn.classList.contains('success')) {
                    document.getElementById('btnText').textContent = '登 录';
                    document.getElementById('btnArrow').textContent = '→';
                    btn.disabled = false;
                    btn.classList.remove('loading');
                }
            }
        }

        // 页面加载时自动聚焦
        document.getElementById('username').focus();
    </script>
</body>
</html>
